<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng cổ phiếu Việt Nam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">Bảng cổ phiếu<span>HOSE · HNX · UPCoM</span></div>
  <span id="status" class="badge">Đang khởi động</span>
  <form id="searchForm" class="search" autocomplete="off">
    <input id="code" list="codes" placeholder="Nhập mã, ví dụ HPG, ACB" maxlength="5" aria-label="Mã cổ phiếu">
    <datalist id="codes"></datalist>
    <button type="submit">Xem</button>
  </form>
  <details class="cfg">
    <summary>Cài đặt nguồn</summary>
    <label>Proxy CORS (tuỳ chọn)<input id="proxy" placeholder="https://your-proxy.example/?url="></label>
    <button id="saveProxy" type="button">Lưu</button>
  </details>
</header>

<main>
  <section class="hero" id="hero">
    <div class="panel id">
      <div class="idrow">
        <div class="logo" id="logo">–</div>
        <div><h1 id="hName">Đang tải…</h1><div class="sub" id="hSub"></div></div>
      </div>
      <div class="price" id="hPrice">–</div>
      <div class="meta"><span class="badge" id="hBadge"></span></div>
      <div class="spark"><canvas id="spark"></canvas></div>
      <div class="seg" id="rangeSeg" role="group" aria-label="Khoảng thời gian">
        <button data-r="30">1T</button><button data-r="90">3T</button><button data-r="180">6T</button><button data-r="365" class="on">1N</button><button data-r="1825">5N</button><button data-r="0">Tất cả</button>
      </div>
    </div>
    <div class="panel view"><h2>Góc nhìn định giá</h2><div id="hView"></div></div>
    <div class="panel kv"><h2>Chỉ số cơ bản</h2><div id="hKv"></div></div>
  </section>

  <div class="toolbar">
    <div class="seg" id="perSeg" role="group" aria-label="Kỳ báo cáo"><button data-p="year" class="on">Theo năm</button><button data-p="quarter">Theo quý</button></div>
    <span class="note" id="vNote"></span>
  </div>
  <section class="grid" id="grid"></section>
</main>

<footer>
  <p>Dữ liệu chỉ mang tính tham khảo, không phải khuyến nghị đầu tư. Ứng dụng không dùng số liệu mẫu: chỉ tiêu nào nguồn không cung cấp sẽ hiện "Chưa có dữ liệu".</p>
  <details><summary>Chẩn đoán kết nối dữ liệu</summary><div id="diag"></div></details>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="live.js"></script>
<script src="app.js"></script>
</body>
</html>
